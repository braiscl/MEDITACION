<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditación diaria — Marco Aurelio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap');

  :root{
    --bg: #17181a;
    --bg-2: #1d1f21;
    --bone: #ece6d9;
    --bone-dim: #9c988c;
    --bronze: #8a9a83;
    --hairline: #33342f;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg) 70%);
    color: var(--bone);
    font-family: 'Spectral', serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 6vh 6vw;
  }

  /* gnomon — sombra que gira según la hora del día, muy tenue */
  .gnomon-field{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .gnomon-line{
    position: absolute;
    top: 50%; left: 50%;
    width: 1px;
    height: 140vmax;
    background: linear-gradient(to bottom, transparent, rgba(138,154,131,0.05) 40%, transparent 70%);
    transform-origin: top center;
  }

  main{
    position: relative;
    max-width: 620px;
    width: 100%;
  }

  .eyebrow{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--bone-dim);
    margin-bottom: 2.6rem;
  }

  .eyebrow .dia{
    color: var(--bronze);
  }

  .hairline{
    height: 1px;
    background: var(--hairline);
    margin: 0 0 2.6rem 0;
  }

  blockquote{
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.5rem, 4vw, 2.35rem);
    line-height: 1.42;
    color: var(--bone);
    letter-spacing: 0.002em;
  }

  blockquote::before{
    content: "“";
    color: var(--bronze);
    opacity: 0.6;
  }
  blockquote::after{
    content: "”";
    color: var(--bronze);
    opacity: 0.6;
  }

  .cita{
    margin-top: 2.2rem;
    text-align: right;
    font-family: 'Spectral', serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--bronze);
  }

  footer{
    margin-top: 4rem;
    display:flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Spectral', serif;
    font-size: 0.75rem;
    color: var(--bone-dim);
    letter-spacing: 0.03em;
  }

  .refresh-note{
    font-style: italic;
    opacity: 0.7;
  }

  @media (max-width: 480px){
    footer{ flex-direction: column; align-items: flex-start; gap: 0.4rem; }
  }
</style>
</head>
<body>

<div class="gnomon-field"><div class="gnomon-line" id="gnomon"></div></div>

<main>
  <div class="eyebrow">
    <span>Meditaciones · Marco Aurelio</span>
    <span class="dia" id="dia-romano">DÍA —</span>
  </div>
  <div class="hairline"></div>

  <blockquote id="quote">Cargando…</blockquote>
  <div class="cita" id="cita"></div>

  <footer>
    <span id="fecha"></span>
    <span class="refresh-note">cambia cada día, a medianoche</span>
  </footer>
</main>

<script>
  // Selección — traducción propia a partir de pasajes de dominio público
  // (Libro y sección citados, traducción George Long / ed. 1862, dominio público)
  const meditaciones = [
    { texto: "Date tiempo para aprender algo bueno y deja de vagar de un lado a otro.", cita: "Libro II, 4" },
    { texto: "No hagas nada contra tu voluntad, ni contra la comunidad, ni sin la debida reflexión, ni de mala gana.", cita: "Libro III, 5" },
    { texto: "En cualquier momento que quieras, está en tu poder retirarte a tu propio interior y hallar reposo, libre de toda ocupación.", cita: "Libro IV, 3" },
    { texto: "Quita la opinión, y ningún hombre se sentirá agraviado.", cita: "Libro IV, 7" },
    { texto: "¿Tienes razón? La tienes. ¿Por qué entonces no la usas? Porque si tu razón cumple su parte, ¿qué más puedes pedir?", cita: "Libro IV, 11" },
    { texto: "No vivas como si tuvieras miles de años por delante. La muerte pende sobre ti: mientras vivas, mientras puedas, sé bueno.", cita: "Libro IV, 14" },
    { texto: "No te desvíes del camino: en cada impulso y deseo, cumple lo que es justo.", cita: "Libro IV, 18" },
    { texto: "Debes ser como un promontorio del mar: aunque las olas rompan sin cesar contra él, permanece firme, y a su alrededor las aguas se calman.", cita: "Libro IV, 40" },
    { texto: "Todo lo que hagas o emprendas, hazlo como quien, hasta donde sabe, podría partir de esta vida en este mismo instante.", cita: "Libro II, 8" },
    { texto: "Sé alegre, y no tengas necesidad de la ayuda ni de la calma que otros deban proporcionarte.", cita: "Libro III, 6" },
    { texto: "Al amanecer, cuando te cueste levantarte, dite a ti mismo: me despierto para hacer el trabajo de un hombre.", cita: "Libro V, 1" },
    { texto: "Nada engendra tanto una verdadera grandeza de alma como poder examinar con método todo lo que sucede en esta vida.", cita: "Libro III, 11" },
    { texto: "Nadie puede decirse que vive más que aquello que ahora está presente, que no es sino un instante.", cita: "Libro III, 10" },
    { texto: "No permitas que esa parte excelente de ti se someta ni se haga esclava; no dejes que tema o rehúya lo que el destino te tiene dispuesto.", cita: "Libro I, 16" },
    { texto: "Es hora de comprender la verdadera naturaleza del mundo del que formas parte, y de aquel que lo gobierna.", cita: "Libro II, 1" },
    { texto: "Cuida la serie entera de tus pensamientos, y evita todo lo ocioso e innecesario.", cita: "Libro III, 4" },
    { texto: "Sigue siempre el camino más breve. Y el más breve es el que va conforme a la naturaleza.", cita: "Libro IV, 43" },
    { texto: "Aunque vivieras tres mil años, o diez mil, recuerda que nadie pierde otra vida que la que vive ahora.", cita: "Libro II, 12" },
    { texto: "Lo que te sea provechoso, oh Mundo, me es provechoso a mí; nada de lo que a ti te llega a tiempo, llega tarde para mí.", cita: "Libro IV, 19" },
    { texto: "Así como el nacimiento, también la muerte es un secreto de la sabiduría de la naturaleza.", cita: "Libro IV, 5" },
    { texto: "Estás a punto de morir, y sin embargo aún no has alcanzado la perfecta sencillez.", cita: "Libro III, 30" },
    { texto: "¿En qué está puesta ahora tu mente? ¿De qué se compone? ¿Cuánto puede durar?", cita: "Libro III, 12" },
    { texto: "Al amanecer, dite a ti mismo: hoy tendré que tratar con un entrometido, un desagradecido, un insolente, un falso, un envidioso, un insociable.", cita: "Libro I, 15" },
    { texto: "Todas las cosas que suceden en el mundo son tan naturales y ordinarias como una rosa en primavera y fruto en verano.", cita: "Libro III, 36" }
  ];

  const numerosRomanos = (num) => {
    const valores = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
    let res = "";
    for (const [v, s] of valores){ while(num >= v){ res += s; num -= v; } }
    return res;
  };

  const ahora = new Date();
  const inicioAno = new Date(ahora.getFullYear(), 0, 0);
  const diaDelAno = Math.floor((ahora - inicioAno) / 86400000);
  const idx = diaDelAno % meditaciones.length;
  const elegida = meditaciones[idx];

  document.getElementById('quote').textContent = elegida.texto;
  document.getElementById('cita').textContent = "— Marco Aurelio, " + elegida.cita;
  document.getElementById('dia-romano').textContent = "DÍA " + numerosRomanos(diaDelAno);

  document.getElementById('fecha').textContent = ahora.toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });

  // gnomon: gira según la hora del día (0h → 0°, 24h → 360°)
  const fraccionDia = (ahora.getHours() * 60 + ahora.getMinutes()) / 1440;
  document.getElementById('gnomon').style.transform = `translateX(-50%) rotate(${fraccionDia * 360}deg)`;
</script>

</body>
</html>
